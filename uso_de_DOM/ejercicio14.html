<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>stopPropagation</title>
</head>
<body>
    <div id="elementoPadre">
        <div id="elementoHijo"> Elemento hijo</div>
    </div>
    <script>
        const elementoHijo = document.getElementById('elementoHijo');
        elementoHijo.addEventListener('click', (evento) => {
            evento.stopPropagation();
            alert('Has hecho click en el elemento hijo');
        });
        const elementoPadre = document.getElementById('elementoPadre');
        elementoPadre.addEventListener('click', (evento) => {
            evento.alert('Has hecho click en el elemento padre');
        });
    </script>
</body>
</html>
