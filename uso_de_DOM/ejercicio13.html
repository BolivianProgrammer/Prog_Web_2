<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prevenir accion por defecto</title>
</head>
<body>
    <button id="enlace" href="https://instagram.com"> Enlace Instagram</button>
    <script>
        const enlace = document.getElementById('enlace');
        enlace.addEventListener('click', (evento) => {
            evento.preventDefault();
            alert('No puedes acceder a la página de Instagram');
        });
    </script>
</body>
</html>
