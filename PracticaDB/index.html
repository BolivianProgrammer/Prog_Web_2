<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manejo de Tareas</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Manejo Tareas</h1>
        
        <div class="task-form">
            <div class="form-group">
                <label for="taskName">Nombre Tarea:</label>
                <input type="text" id="taskName" placeholder="Enter task name">
            </div>
            
            <div class="form-group">
                <label for="taskValue">Numero entero:</label>
                <input type="number" id="taskValue" placeholder="Enter a number" step="1">
            </div>
            
            <div class="button-group">
                <button id="getBtn" class="btn">Mostrar tareas</button>
                <button id="postBtn" class="btn">Agregar tarea</button>
                <button id="putBtn" class="btn">Actualizar tarea</button>
                <button id="deleteBtn" class="btn">Eliminar tarea</button>
            </div>
        </div>
        
        <div class="task-list">
            <h2>Tareas</h2>
            <table id="taskTable">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre tarea</th>
                        <th>Valor</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="taskTableBody">
                </tbody>
            </table>
        </div>
    </div>

    <script src="js/get.js"></script>
    <script src="js/post.js"></script>
    <script src="js/put.js"></script>
    <script src="js/delete.js"></script>
</body>
</html>
